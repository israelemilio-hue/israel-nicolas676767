<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Etapa 1 de 4</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <main class="container">
    <!-- Cabeçalho de Progresso -->
    <div class="progress-header">
      <div class="progress-labels">
        <span class="step-indicator">ETAPA 1 DE 4</span>
        <span class="step-title">Seu Nome</span>
      </div>
      
      <div class="progress-bar-bg">
        <div class="progress-bar-fill"></div>
      </div>

      <div class="stepper">
        <div class="step-node active">1</div>
        <div class="step-node">2</div>
        <div class="step-node">3</div>
        <div class="step-node">4</div>
      </div>
    </div>

    <!-- Formulário Principal -->
    <section class="form-section">
      <h1 class="form-title">Qual é o seu nome completo?</h1>
      
      <div class="input-container">
        <input 
          type="text" 
          id="fullName" 
          class="custom-input" 
          placeholder="Maria Oliveira da Silva" 
          aria-describedby="helper-text"
          autocomplete="name"
        >
        <p id="helper-text" class="helper-text">Exemplo: Maria Oliveira da Silva</p>
      </div>

      <button type="button" id="nextBtn" class="btn-primary">
        Avançar para endereço &rarr;
      </button>
    </section>
  </main>

  <!-- Botão Flutuante de Ajuda -->
  <button type="button" class="help-btn" aria-label="Central de ajuda e suporte">?</button>

  <main class="container">
    <!-- Cabeçalho de Progresso -->
    <div class="progress-header">
      <div class="progress-labels">
        <span class="step-indicator">ETAPA 2 DE 4</span>
        <span class="step-title">Seu Endereço</span>
      </div>
      
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" style="width: 50%;"></div>
      </div>

      <div class="stepper step-2">
        <div class="step-node completed">&#10003;</div>
        <div class="step-node active">2</div>
        <div class="step-node">3</div>
        <div class="step-node">4</div>
      </div>
    </div>

    <!-- Formulário Principal -->
    <section class="form-section">
      <h1 class="form-title">Qual é o seu CEP?</h1>
      
      <div class="input-container">
        <input 
          type="text" 
          id="cepInput" 
          class="custom-input" 
          placeholder="01234-567" 
          maxlength="9"
          inputmode="numeric"
          aria-describedby="helper-text"
        >
        <p id="helper-text" class="helper-text">Exemplo: 01234-567</p>
      </div>

      <div class="button-group">
        <button type="button" id="nextBtn" class="btn-primary">
          Avançar para telefone &rarr;
        </button>
        <button type="button" id="backBtn" class="btn-secondary">
          &larr; Voltar para etapa anterior
        </button>
      </div>
    </section>
  </main>

  <!-- Botão Flutuante de Ajuda -->
  <button type="button" class="help-btn" aria-label="Central de ajuda e suporte">?</button>

  <script src="main.js"></script>
</body>
</html>
